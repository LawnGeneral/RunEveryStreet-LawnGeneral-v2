name: Update Strava LifeMap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lifemap:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange Strava authorization code
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_AUTH_CODE: ${{ secrets.STRAVA_AUTH_CODE }}
        run: |
          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -X POST https://www.strava.com/oauth/token \
            -d client_id="$STRAVA_CLIENT_ID" \
            -d client_secret="$STRAVA_CLIENT_SECRET" \
            -d code="$STRAVA_AUTH_CODE" \
            -d grant_type=authorization_code)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Strava authorization-code exchange failed with HTTP $HTTP_CODE"
            jq '{message, errors}' "$RESPONSE_FILE"
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token' "$RESPONSE_FILE")
          NEW_REFRESH_TOKEN=$(jq -r '.refresh_token' "$RESPONSE_FILE")
          GRANTED_SCOPE=$(jq -r '.scope // "scope not returned"' "$RESPONSE_FILE")

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$NEW_REFRESH_TOKEN"

          echo "Strava authorization successful."
          echo "Granted scope: $GRANTED_SCOPE"

          echo "STRAVA_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "NEW_REFRESH_TOKEN=$NEW_REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Save new Strava refresh token
        env:
          GH_TOKEN: ${{ secrets.LIFEMAP_GITHUB_TOKEN }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN \
            --body "$NEW_REFRESH_TOKEN" \
            --repo "$GITHUB_REPOSITORY"

          echo "New Strava refresh token saved."

      - name: Test Strava activity access
        run: |
          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $STRAVA_ACCESS_TOKEN" \
            "https://www.strava.com/api/v3/athlete/activities?per_page=10")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Strava activity request failed with HTTP $HTTP_CODE"
            jq '{message, errors}' "$RESPONSE_FILE"
            exit 1
          fi

          ACTIVITY_COUNT=$(jq 'length' "$RESPONSE_FILE")
          RUN_COUNT=$(jq '[.[] | select(.sport_type == "Run" or .type == "Run")] | length' "$RESPONSE_FILE")

          echo "Strava activity access successful."
          echo "Latest activities returned: $ACTIVITY_COUNT"
          echo "Runs among those activities: $RUN_COUNT"
