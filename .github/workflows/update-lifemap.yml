name: Update Strava LifeMap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lifemap:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh Strava access token
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -X POST https://www.strava.com/oauth/token \
            -d client_id="$STRAVA_CLIENT_ID" \
            -d client_secret="$STRAVA_CLIENT_SECRET" \
            -d grant_type=refresh_token \
            -d refresh_token="$STRAVA_REFRESH_TOKEN")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Strava token refresh failed with HTTP $HTTP_CODE"
            jq '{message, errors}' "$RESPONSE_FILE"
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token' "$RESPONSE_FILE")
          NEW_REFRESH_TOKEN=$(jq -r '.refresh_token' "$RESPONSE_FILE")

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$NEW_REFRESH_TOKEN"

          echo "Strava authentication successful."

          echo "STRAVA_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "NEW_REFRESH_TOKEN=$NEW_REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Save newest Strava refresh token
        env:
          GH_TOKEN: ${{ secrets.LIFEMAP_GITHUB_TOKEN }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN \
            --body "$NEW_REFRESH_TOKEN" \
            --repo "$GITHUB_REPOSITORY"

          echo "Newest Strava refresh token saved."

      - name: Test latest run GPS stream
        run: |
          ACTIVITIES_FILE=$(mktemp)

          HTTP_CODE=$(curl --silent --show-error \
            --output "$ACTIVITIES_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $STRAVA_ACCESS_TOKEN" \
            "https://www.strava.com/api/v3/athlete/activities?per_page=30")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Could not retrieve Strava activities."
            exit 1
          fi

          LATEST_RUN_ID=$(jq -r \
            '[.[] | select(.sport_type == "Run" or .type == "Run")][0].id // empty' \
            "$ACTIVITIES_FILE")

          LATEST_RUN_NAME=$(jq -r \
            '[.[] | select(.sport_type == "Run" or .type == "Run")][0].name // "Unnamed run"' \
            "$ACTIVITIES_FILE")

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No recent run was found."
            exit 1
          fi

          echo "Latest run: $LATEST_RUN_NAME"

          STREAM_FILE=$(mktemp)

          HTTP_CODE=$(curl --silent --show-error \
            --output "$STREAM_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $STRAVA_ACCESS_TOKEN" \
            "https://www.strava.com/api/v3/activities/$LATEST_RUN_ID/streams?keys=latlng&key_by_type=true")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Could not retrieve GPS stream. HTTP $HTTP_CODE"
            jq '{message, errors}' "$STREAM_FILE"
            exit 1
          fi

          GPS_COUNT=$(jq '
            if type == "object" then
              (.latlng.data // [] | length)
            elif type == "array" then
              ([.[] | select(.type == "latlng")][0].data // [] | length)
            else
              0
            end
          ' "$STREAM_FILE")

          echo "GPS points received: $GPS_COUNT"

          if [ "$GPS_COUNT" -eq 0 ]; then
            echo "No GPS points were returned."
            exit 1
          fi

          echo "Latest run GPS access successful."
