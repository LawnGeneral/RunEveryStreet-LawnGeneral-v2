<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RunEveryStreet</title>

  <script src="libraries/p5.js"></script>
  <script src="libraries/p5.dom.js"></script>
  <script src="libraries/p5.sound.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <script src="https://unpkg.com/ol-mapbox-style@13.4.2/dist/olms.js"></script>

  <style>
    html, 
      width: 100body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
  position: relative;
  background-color: #0f1720;
  color: #f8fafc;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

.header-bar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 100%;
  height: 40px;
  padding: 0 14px;
  box-sizing: border-box;
  gap: 12px;

  background: rgba(20, 27, 36, 0.98);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.24);

  pointer-events: none;
}

.header-bar button,
.header-bar a {
  pointer-events: auto;
}

.left-group,
.center-group,
.right-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.left-group img {
  display: block;
}

.center-group {
  flex: 1;
  justify-content: center;
}

.right-group {
  justify-content: flex-end;
}

.header-bar button {
  appearance: none;
  height: 30px;
  padding: 0 13px;

  color: #ffffff;
  border: 1px solid transparent;
  border-radius: 8px;

  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.025em;
  white-space: nowrap;

  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);

  transition:
    background-color 140ms ease,
    border-color 140ms ease,
    transform 140ms ease,
    box-shadow 140ms ease;
}

.header-bar button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
}

.header-bar button:active {
  transform: translateY(0);
}

.header-bar button:focus-visible,
.right-group > a:focus-visible {
  outline: 2px solid #67e8f9;
  outline-offset: 2px;
}

#mode-toggle {
  background: #293544;
  border-color: #465569;
}

#mode-toggle:hover {
  background: #364559;
  border-color: #607089;
}

#draw-area-btn {
  background: #0f766e;
  border-color: #159487;
}

#draw-area-btn:hover {
  background: #118b80;
}

#ingest-btn {
  background: #2563eb;
  border-color: #4b7ff0;
}

#ingest-btn:hover {
  background: #3474f3;
}

#undo-btn {
  display: none;
  background: #7c3aed;
  border-color: #9564ee;
}

#undo-btn:hover {
  background: #8b4df0;
}

.right-group > a {
  padding: 5px 8px;

  color: #d6dee8;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 6px;

  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  white-space: nowrap;

  transition:
    color 140ms ease,
    background-color 140ms ease,
    border-color 140ms ease;
}

.right-group > a:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.20);
}


    .osm-attrib {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
    }
    .osm-attrib a:link, .osm-attrib a:visited {
      color: white;
      text-decoration: none;
    }
    .osm-attrib a:hover { text-decoration: underline; }

    #ol-map {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      width: 100vw;
      height: calc(100vh - 40px);
      z-index: 1;
    }

    canvas.p5Canvas, #defaultCanvas0 {
      position: fixed !important;
      top: 40px !important;
      left: 0 !important;
      width: 100% !important;
      height: calc(100vh - 40px) !important;
      z-index: 5;
      display: block;
      pointer-events: none;
    }

    .ol-attribution {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="header-bar">
    <div class="left-group">
      <img src="assets/logosmalllit.png" alt="Logo" style="height: 25px;" />
    </div>

    <div class="center-group">
      <button id="mode-toggle" onclick="togglePanTrim()">MODE: PAN/ZOOM</button>
      <button id="draw-area-btn" onclick="startRoadAreaDrawing()">DRAW AREA</button>
      <button id="ingest-btn" onclick="triggerIngest()">LOAD ROADS</button>
      <button id="undo-btn" onclick="undoTrim()">UNDO TRIM</button>
     


    </div>

    <div class="right-group">
      <span class="osm-attrib">
        <a href="https://openfreemap.org/" target="_blank" rel="noopener">
  OpenFreeMap
</a>
•
<a href="https://openmaptiles.org/" target="_blank" rel="noopener">
  © OpenMapTiles
</a>
•
<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">
  © OpenStreetMap contributors
</a>
      </span>
      <a href="https://codeberg.org/lejun/RunEveryStreet/" target="_blank">Source Code</a>
      <a href=".">Restart</a>
    </div>
  </div>

  <div id="ol-map"></div>

  <script src="sketch.js"></script>
  <script src="Edge.js"></script>
  <script src="Node.js"></script>
  <script src="Route.js"></script>
</body>
</html>
